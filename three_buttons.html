<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политические течения</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Orbitron:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(1deg, #f0f0f0, #0f0f0f);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Bangers', cursive;
            position: relative;
        }

        .background-sections {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .section {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Троцкизм - левая вертикальная полоса */
        .trotskyism {
            width: 15%;
            height: 100%;
            left: 0;
            background: linear-gradient(to right, rgba(255, 0, 0, 1), rgba(255, 0, 0, 1));
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 10px;
        }

        /* Консерватизм - вторая вертикальная полоса */
        .conservatism {
            width: 15%;
            height: 100%;
            left: 15%;
            background: linear-gradient(to right, rgba(0, 255, 0, 0.5), rgba(0, 255, 0, 0.5));
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 6px;
        }

        /* Либерализм - горизонтальная полоса сверху */
        .liberalism {
            width: 40%;
            height: 50%;
            left: 30%;
            top: 100;
            background: linear-gradient(to bottom, rgba(0, 0, 255, 0.5), rgba(0, 0, 255, 0.5));
        }

        /* Фашизм - горизонтальная полоса снизу */
        .fascism {
            width: 40%;
            height: 50%;
            left: 30%;
            bottom: 0%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5));
        }

        /* Монархия - правая вертикальная полоса */
        .monarchy {
            width: 15%;
            height: 100%;
            right: 15%;
            background: linear-gradient(to left, rgba(255, 200, 0, 0.5), rgba(255, 200, 0, 0.5));
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 6px;
        }

        /* Теократия - последняя вертикальная полоса */
        .theocracy {
            width: 15%;
            height: 100%;
            right: 0;
            background: linear-gradient(to left, rgba(0, 0, 0, 1), rgba(0, 0, 0, 1));
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 10px;
        }

        .top-bar {
            width: 100%;
            background-color: #0f0f0f;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            font-size: 36px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60vh;
            position: relative;
            overflow: hidden;
        }

        .block {
            width: 400px;
            height: 250px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .button {
            padding: 15px 30px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            color: #fff;
            font-family: 'Rubik', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background-color: #444;
            transform: scale(1.05);
        }

        .nav-button {
            width: 60px;
            height: 60px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            z-index: 10;
            transition: all 0.3s;
            bottom: 20px;
        }

        .nav-button:hover {
            background-color: #444;
            transform: scale(1.1);
        }

        .nav-button.left {
            left: calc(50% - 280px);
        }

        .nav-button.right {
            right: calc(50% - 280px);
        }

        .arrow {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
        }

        .bottom-bar {
            width: 100%;
            background-color: #0f0f0f;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .choice-button {
            padding: 15px 30px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            color: #fff;
            font-family: 'Rubik', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .choice-button:hover {
            background-color: #444;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="background-sections">
        <div class="section trotskyism">TROTSKYISM</div>
        <div class="section conservatism">CONSERVATISM</div>
        <div class="section fascism">FASCISM</div>
        <div class="section monarchy">MONARCHY</div>
        <div class="section theocracy">THEOCRACY</div>
        <div class="section liberalism">LIBERALISM</div>
    </div>

    <div class="top-bar">Что изменчиво?</div>

    <div class="container">
        <div class="block" id="block1">
            <button class="button" onclick="window.location.href='revolution_vs_tradition'"> Троцкизм или консерватизм? </button>
        </div>
        <div class="block" id="block2" style="transform: translateX(100vw);">
            <button class="button" onclick="window.location.href='libertad_vs_fascismo'"> Либерализм или фашизм? </button>
        </div>
        <div class="block" id="block3" style="transform: translateX(-100vw);">
            <button class="button" onclick="window.location.href='monarchy_vs_theocracy'"> Монархия или теократия? </button>
        </div>
    </div>

    <div class="nav-button left" onclick="previousBlock()">
        <span class="arrow">←</span>
    </div>

    <div class="nav-button right" onclick="nextBlock()">
        <span class="arrow">→</span>
    </div>

    <a href="/certificate_or_not_certificate" class="button">Узнать результаты</a>

    <script>
        let currentBlock = 0;
        const blocks = document.querySelectorAll('.block');
        const totalBlocks = blocks.length;

        function showBlock(index) {
            blocks.forEach((block, i) => {
                if (i === index) {
                    block.style.transform = 'translateX(0)';
                } else if (i === (index + 1) % totalBlocks) {
                    block.style.transform = 'translateX(100vw)';
                } else {
                    block.style.transform = 'translateX(-100vw)';
                }
            });
        }

        function nextBlock() {
            currentBlock = (currentBlock + 1) % totalBlocks;
            showBlock(currentBlock);
        }

        function previousBlock() {
            currentBlock = (currentBlock - 1 + totalBlocks) % totalBlocks;
            showBlock(currentBlock);
        }

        showBlock(currentBlock);
    </script>
</body>
</html>
